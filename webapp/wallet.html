<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>أنشطة المحفظة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0b0f17);
    --bg2: var(--tg-theme-secondary-bg-color, #111827);
    --card: color-mix(in srgb, var(--bg2) 92%, var(--text) 8%);
    --text: var(--tg-theme-text-color, #f3f4f6);
    --muted: var(--tg-theme-hint-color, #9ca3af);
    --accent: var(--tg-theme-button-color, #2aabee);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--text) 10%, transparent);
    --up: #22c55e;
    --down: #ef4444;
    --gram: #2aabee;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5; padding: 16px 16px 32px; min-height: 100vh; overflow-x: hidden; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  .wrap { max-width: 560px; margin: 0 auto; }

  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .avatar { width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center; background: linear-gradient(135deg, var(--gram), #6d5dfc); color: #fff; font-weight: 700; font-size: 20px; }
  .head-info { min-width: 0; flex: 1; }
  .head-title { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--up) 18%, transparent); color: var(--up); }
  .badge.off { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--muted); }
  .addr { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .addr .num { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { border: 0; background: var(--card); color: var(--text); border-radius: 10px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; flex: none; }

  .hero { background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--gram) 35%, transparent), transparent 60%), var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }
  .hero-label { color: var(--muted); font-size: 13px; }
  .hero-value { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin: 2px 0; }
  .hero-sub { color: var(--muted); font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .stat { background: color-mix(in srgb, var(--bg) 55%, transparent); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 16px; }
  .stat span { color: var(--muted); font-size: 12px; }

  .last { display: flex; align-items: center; gap: 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; }
  .last .meta { flex: 1; min-width: 0; }
  .last .meta small { color: var(--muted); display: block; font-size: 12px; }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg2); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 12px; position: sticky; top: 8px; z-index: 5; border: 1px solid var(--line); }
  .tab { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 9px 4px; border-radius: 10px; cursor: pointer; }
  .tab.active { background: var(--accent); color: var(--accent-text); }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--bg2); border-radius: 14px; padding: 12px; border: 1px solid var(--line); }
  .row.scam { opacity: .55; }
  .ic { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; font-size: 18px; font-weight: 700; overflow: hidden; }
  .ic img { width: 100%; height: 100%; object-fit: cover; }
  .ic.in { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
  .ic.out { background: color-mix(in srgb, var(--down) 16%, transparent); color: var(--down); }
  .ic.other { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .row .meta { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt { text-align: left; flex: none; font-weight: 700; }
  .amt small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .pos { color: var(--up); } .neg { color: var(--down); }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: color-mix(in srgb, var(--down) 18%, transparent); color: var(--down); margin-inline-start: 6px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 440px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .nft { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; }
  .nft .img { aspect-ratio: 1; background: var(--card); display: grid; place-items: center; color: var(--muted); }
  .nft img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .nft .cap { padding: 8px 10px; }
  .nft .cap b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nft .cap span { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

  .more { width: 100%; margin-top: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--accent); font: inherit; font-weight: 600; padding: 12px; border-radius: 14px; cursor: pointer; }
  .more:disabled { opacity: .6; }
  .empty, .error { text-align: center; color: var(--muted); padding: 32px 16px; }
  .error button { margin-top: 12px; }
  .footer { margin-top: 20px; display: flex; gap: 8px; }
  .footer a, .footer button { flex: 1; text-align: center; text-decoration: none; border: 0; border-radius: 14px; padding: 12px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn-main { background: var(--accent); color: var(--accent-text); }
  .btn-alt { background: var(--bg2); color: var(--text); border: 1px solid var(--line) !important; }

  .sk { background: linear-gradient(90deg, var(--card) 0%, color-mix(in srgb, var(--card) 60%, var(--text) 8%) 50%, var(--card) 100%); background-size: 200% 100%; animation: sh 1.2s infinite linear; border-radius: 10px; }
  @keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .hidden { display: none !important; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div id="app">
    <div class="head">
      <div class="avatar sk"></div>
      <div class="head-info"><div class="sk" style="height:18px;width:60%;margin-bottom:6px"></div><div class="sk" style="height:12px;width:80%"></div></div>
    </div>
    <div class="sk" style="height:170px;border-radius:18px;margin-bottom:12px"></div>
    <div class="sk" style="height:68px;border-radius:18px;margin-bottom:16px"></div>
    <div class="sk" style="height:48px;border-radius:14px;margin-bottom:12px"></div>
    <div class="sk" style="height:64px;border-radius:14px;margin-bottom:8px"></div>
    <div class="sk" style="height:64px;border-radius:14px;margin-bottom:8px"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  const ADDR_RE = /^[EUk0][Qf][A-Za-z0-9_-]{46}$/;
  const params = new URLSearchParams(location.search);
  let address = params.get("address") || params.get("tgWebAppStartParam") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
  address = (address || "").trim();

  const app = document.getElementById("app");
  const state = { tab: "activity", events: [], nextFrom: 0, nfts: [], nftOffset: 0, nftMore: false, summary: null, loading: false };

  // كل النصوص تمر من هنا حتى ما ينحقن HTML من اسماء الـ NFT او التعليقات
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => (typeof u === "string" && u.startsWith("https://")) ? esc(u) : "";
  const short = (a) => a && a.length > 12 ? a.slice(0, 4) + "…" + a.slice(-4) : (a || "");
  const fmt = (n, d = 2) => Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: d });
  const fmtAmt = (n) => Math.abs(n) < 1 ? fmt(n, 4) : fmt(n, 2);
  const ago = (ts) => {
    if (!ts) return "";
    const diff = Math.max(0, Date.now() / 1000 - ts);
    if (diff < 60) return "الآن";
    if (diff < 3600) return "منذ " + Math.floor(diff / 60) + " دقيقة";
    if (diff < 86400) return "منذ " + Math.floor(diff / 3600) + " ساعة";
    if (diff < 86400 * 30) return "منذ " + Math.floor(diff / 86400) + " يوم";
    return new Date(ts * 1000).toLocaleDateString("en-GB");
  };
  const haptic = (t) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} };
  const toast = (msg) => { const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1600); };
  const openLink = (url) => { if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank", "noopener"); };

  async function api(path) {
    const r = await fetch(path, { cache: "no-store" });
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }

  function showError(msg, retry) {
    app.innerHTML = '<div class="error"><div style="font-size:40px">⚠️</div><div>' + esc(msg) + '</div>' +
      (retry ? '<button class="more" id="retry">إعادة المحاولة</button>' : '') + '</div>';
    if (retry) document.getElementById("retry").onclick = retry;
  }

  function renderShell(s) {
    const active = s.status === "active";
    const t = s.last_transfer;
    let lastHtml = '<div class="last"><div class="ic other">↻</div><div class="meta"><b>لا توجد تحويلات</b><small>آخر تحويل</small></div></div>';
    if (t) {
      const out = t.direction === "out";
      const cp = t.counterparty || {};
      lastHtml = '<div class="last"><div class="ic ' + (out ? "out" : "in") + '">' + (out ? "↑" : "↓") + '</div>' +
        '<div class="meta"><b>آخر تحويل: ' + (out ? "إرسال" : "استلام") + '</b><small>' + (out ? "إلى " : "من ") +
        '<span class="num">' + esc(cp.name || short(cp.address)) + '</span> · ' + esc(ago(t.timestamp)) + '</small></div>' +
        '<div class="amt num ' + (out ? "neg" : "pos") + '">' + (out ? "−" : "+") + esc(fmtAmt(t.amount)) + ' ' + esc(t.symbol) +
        (t.usd >= 0.01 ? '<small>≈ $' + esc(fmt(t.usd)) + '</small>' : '') + '</div></div>';
    }
    const nftCount = s.nft_more ? fmt(s.nft_count, 0) + "+" : fmt(s.nft_count, 0);
    app.innerHTML =
      '<div class="head"><div class="avatar">' + esc((s.name || "G").slice(0, 1).toUpperCase()) + '</div>' +
        '<div class="head-info"><div class="head-title">' + esc(s.name || "محفظة GRAM") +
          '<span class="badge ' + (active ? "" : "off") + '">' + (active ? "نشطة" : "غير مفعلة") + '</span></div>' +
          '<div class="addr"><span class="num">' + esc(address) + '</span></div></div>' +
        '<button class="icon-btn" id="copy">نسخ</button></div>' +
      '<div class="hero"><div class="hero-label">الرصيد</div>' +
        '<div class="hero-value num">' + esc(fmt(s.balance_ton)) + ' <span style="font-size:18px;color:var(--gram)">GRAM</span></div>' +
        '<div class="hero-sub num">≈ $' + esc(fmt(s.balance_usd)) + (s.ton_price ? ' · 1 GRAM = $' + esc(fmt(s.ton_price, 3)) : '') + '</div>' +
        '<div class="stats">' +
          '<div class="stat"><b class="num">' + esc(fmt(s.usdt)) + '</b><span>USDT</span></div>' +
          '<div class="stat"><b class="num">' + esc(nftCount) + '</b><span>مقتنيات NFT</span></div>' +
          '<div class="stat"><b class="num">$' + esc(fmt(s.total_usd)) + '</b><span>القيمة الكلية</span></div>' +
        '</div></div>' +
      lastHtml +
      '<div class="tabs"><button class="tab" data-tab="activity">الأنشطة</button><button class="tab" data-tab="nfts">المقتنيات</button><button class="tab" data-tab="tokens">العملات</button></div>' +
      '<div id="panel"></div>' +
      '<div class="footer"><button class="btn-main" id="tonviewer">فتح في Tonviewer</button><button class="btn-alt" id="refresh">تحديث</button></div>';

    document.getElementById("copy").onclick = () => {
      (navigator.clipboard ? navigator.clipboard.writeText(address) : Promise.reject()).then(() => toast("تم نسخ العنوان"), () => toast(address));
    };
    document.getElementById("tonviewer").onclick = () => openLink("https://tonviewer.com/" + encodeURIComponent(address));
    document.getElementById("refresh").onclick = () => { haptic(); load(); };
    app.querySelectorAll(".tab").forEach((b) => b.onclick = () => { haptic(); setTab(b.dataset.tab); });
    setTab(state.tab);
  }

  function setTab(tab) {
    state.tab = tab;
    app.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
    if (tab === "activity") { if (!state.events.length) loadEvents(); else renderEvents(); }
    else if (tab === "nfts") { if (!state.nfts.length && state.nftOffset === 0) loadNfts(); else renderNfts(); }
    else renderTokens();
  }

  const panel = () => document.getElementById("panel");
  const skeletonList = () => '<div class="list">' + Array.from({ length: 5 }, () => '<div class="sk" style="height:64px;border-radius:14px"></div>').join("") + '</div>';

  function actionRow(ev, a) {
    const dir = a.direction;
    const cls = dir === "in" ? "in" : dir === "out" ? "out" : "other";
    const icons = { TonTransfer: dir === "out" ? "↑" : "↓", JettonTransfer: dir === "out" ? "↑" : "↓", JettonSwap: "⇄", NftItemTransfer: "🖼", NftPurchase: "🛍", ContractDeploy: "⚙", AuctionBid: "🔨" };
    const icon = icons[a.type] || "•";
    let title = a.title || a.type;
    if (a.type === "TonTransfer" || a.type === "JettonTransfer") title = dir === "out" ? "إرسال" : "استلام";
    if (a.type === "NftItemTransfer") title = dir === "out" ? "إرسال NFT" : "استلام NFT";
    let sub = "";
    if (a.counterparty || a.counterparty_name) sub = (dir === "out" ? "إلى " : "من ") + '<span class="num">' + esc(a.counterparty_name || short(a.counterparty)) + '</span>';
    else if (a.description) sub = esc(a.description);
    if (a.comment) sub += (sub ? " · " : "") + "💬 " + esc(a.comment);
    sub += (sub ? " · " : "") + esc(ago(ev.ts));
    let amt = "";
    if (a.amount != null) {
      amt = '<div class="amt num ' + (dir === "out" ? "neg" : "pos") + '">' + (dir === "out" ? "−" : "+") + esc(fmtAmt(a.amount)) + " " + esc(a.symbol) +
        (a.usd >= 0.01 ? '<small>≈ $' + esc(fmt(a.usd)) + '</small>' : '') + '</div>';
    } else if (a.value) {
      amt = '<div class="amt num">' + esc(a.value) + '</div>';
    }
    return '<div class="row' + (ev.scam ? " scam" : "") + '" data-ev="' + esc(ev.id) + '"><div class="ic ' + cls + '">' + icon + '</div>' +
      '<div class="meta"><div class="title">' + esc(title) + (ev.scam ? '<span class="tag">احتيال</span>' : '') + (a.status === "failed" ? '<span class="tag">فشلت</span>' : '') + '</div>' +
      '<div class="sub">' + sub + '</div></div>' + amt + '</div>';
  }

  function renderEvents() {
    if (state.tab !== "activity") return;
    if (!state.events.length) { panel().innerHTML = '<div class="empty">لا توجد أنشطة لهذه المحفظة</div>'; return; }
    const rows = state.events.map((ev) => ev.actions.map((a) => actionRow(ev, a)).join("")).join("");
    panel().innerHTML = '<div class="list">' + rows + '</div>' + (state.nextFrom ? '<button class="more" id="moreEv">عرض المزيد</button>' : '');
    panel().querySelectorAll(".row[data-ev]").forEach((r) => r.onclick = () => openLink("https://tonviewer.com/transaction/" + encodeURIComponent(r.dataset.ev)));
    const m = document.getElementById("moreEv");
    if (m) m.onclick = () => { m.disabled = true; m.textContent = "جاري التحميل..."; loadEvents(true); };
  }

  async function loadEvents(more) {
    if (!more) panel().innerHTML = skeletonList();
    try {
      const q = more && state.nextFrom ? "?before_lt=" + encodeURIComponent(state.nextFrom) : "";
      const d = await api("/api/wallet/" + encodeURIComponent(address) + "/events" + q);
      state.events = more ? state.events.concat(d.events || []) : (d.events || []);
      state.nextFrom = d.next_from || 0;
      renderEvents();
    } catch (e) {
      if (state.tab === "activity") panel().innerHTML = '<div class="error">تعذر تحميل الأنشطة<br><button class="more" id="re">إعادة المحاولة</button></div>';
      const re = document.getElementById("re"); if (re) re.onclick = () => loadEvents(more);
    }
  }

  function renderNfts() {
    if (state.tab !== "nfts") return;
    if (!state.nfts.length) { panel().innerHTML = '<div class="empty">لا توجد مقتنيات NFT</div>'; return; }
    const cards = state.nfts.map((n) => {
      const img = safeUrl(n.image);
      return '<div class="nft" data-addr="' + esc(n.address) + '"><div class="img">' + (img ? '<img loading="lazy" src="' + img + '" alt="" onerror="this.remove()">' : '🖼') + '</div>' +
        '<div class="cap"><b>' + esc(n.name) + '</b><span>' + (n.verified ? "✔ " : "") + esc(n.collection || "بدون مجموعة") + '</span></div></div>';
    }).join("");
    panel().innerHTML = '<div class="grid">' + cards + '</div>' + (state.nftMore ? '<button class="more" id="moreNft">عرض المزيد</button>' : '');
    panel().querySelectorAll(".nft").forEach((c) => c.onclick = () => openLink("https://tonviewer.com/" + encodeURIComponent(c.dataset.addr)));
    const m = document.getElementById("moreNft");
    if (m) m.onclick = () => { m.disabled = true; m.textContent = "جاري التحميل..."; loadNfts(true); };
  }

  async function loadNfts(more) {
    if (!more) panel().innerHTML = '<div class="grid">' + Array.from({ length: 6 }, () => '<div class="sk" style="aspect-ratio:0.8;border-radius:14px"></div>').join("") + '</div>';
    try {
      const d = await api("/api/wallet/" + encodeURIComponent(address) + "/nfts?offset=" + state.nftOffset);
      state.nfts = state.nfts.concat(d.items || []);
      state.nftOffset += (d.items || []).length;
      state.nftMore = !!d.has_more;
      renderNfts();
    } catch (e) {
      if (state.tab === "nfts") panel().innerHTML = '<div class="error">تعذر تحميل المقتنيات<br><button class="more" id="re">إعادة المحاولة</button></div>';
      const re = document.getElementById("re"); if (re) re.onclick = () => loadNfts(more);
    }
  }

  function renderTokens() {
    const s = state.summary;
    const rows = [
      { symbol: "GRAM", name: "Gram", amount: s.balance_ton, usd: s.balance_usd, icon: "💎" },
      { symbol: "USDT", name: "Tether USD", amount: s.usdt, usd: s.usdt, icon: "$" },
    ].concat((s.jettons || []).map((j) => ({ symbol: j.symbol, name: j.name, amount: j.amount, usd: j.usd, image: j.image })));
    panel().innerHTML = '<div class="list">' + rows.map((r) => {
      const img = safeUrl(r.image);
      return '<div class="row"><div class="ic other">' + (img ? '<img loading="lazy" src="' + img + '" alt="" onerror="this.remove()">' : esc(r.icon || r.symbol.slice(0, 1))) + '</div>' +
        '<div class="meta"><div class="title">' + esc(r.symbol) + '</div><div class="sub">' + esc(r.name) + '</div></div>' +
        '<div class="amt num">' + esc(fmtAmt(r.amount)) + (r.usd >= 0.01 ? '<small>≈ $' + esc(fmt(r.usd)) + '</small>' : '') + '</div></div>';
    }).join("") + '</div>';
  }

  async function load() {
    state.events = []; state.nfts = []; state.nftOffset = 0; state.nextFrom = 0;
    try {
      state.summary = await api("/api/wallet/" + encodeURIComponent(address));
      renderShell(state.summary);
    } catch (e) {
      showError("تعذر جلب معلومات المحفظة، حاول مرة ثانية", load);
    }
  }

  if (!ADDR_RE.test(address)) showError("عنوان المحفظة غير صالح");
  else load();
})();
</script>
</body>
</html>
